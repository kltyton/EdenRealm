plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

repositories {
    exclusiveContent {
        forRepository { flatDir { dirs 'libs/kui' } }
        filter { includeGroup('io.github.kltyton.kltytonui') }
    }
    mavenLocal()
    maven {
        name = 'Latvian'
        url = 'https://maven.latvian.dev/releases'
        content { includeGroup('dev.latvian.mods') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Fuzs Mod Resources'
                url = uri('https://raw.githubusercontent.com/Fuzss/modresources/main/maven/')
            }
        }
        filter {
            includeGroupAndSubgroups('fuzs.forgeconfigapiport')
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter {
            includeGroup('com.geckolib')
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def dataGenerationArguments = [
        '--mod', project.mod_id,
        '--all',
        '--output', file('src/generated/resources/').getAbsolutePath(),
        '--existing', file('src/main/resources/').getAbsolutePath()
]

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll dataGenerationArguments
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.test {
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
}

dependencies {
    jarJar(implementation("io.github.kltyton.kltytonui:KltytonUI-neoforge-26.2:${kltytonui_version}")) {
        version {
            strictly "[${kltytonui_version}]"
            prefer kltytonui_version
        }
    }

    jarJar(implementation("dev.latvian.mods:rhino:${rhino_version}")) {
        version {
            strictly "[${rhino_version}]"
            prefer rhino_version
        }
    }

    jarJar(implementation("org.mesdag:ParticleStorm-neoforge-${minecraft_version}")) {
        version {
            strictly "[${particle_storm_version}]"
            prefer particle_storm_version
        }
    }

    jarJar(implementation("com.kltyton:bonehitboxlib-neoforge-26.2")) {
        version {
            strictly "[${bonehitboxlib_version}]"
            prefer bonehitboxlib_version
        }
    }

    implementation "com.geckolib:geckolib-neoforge-26.2:${geckolib_version}"

    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

tasks.register('verifyAutomaticBlockShapes', JavaExec) {
    group = 'verification'
    description = 'Checks automatic multi-cell model shape splitting and whole-outline coordinates.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kltyton.eden_realm.common.block.shape.ModelShapeCacheCheck'
    def checkDirectory = layout.buildDirectory.dir('automatic-shape-check')
    workingDir = checkDirectory
    doFirst {
        checkDirectory.get().asFile.mkdirs()
    }
}

tasks.register('verifyPlantBehavior', JavaExec) {
    group = 'verification'
    description = 'Checks calibrated plant shapes, stable fungus variants, and vanilla-style plant loot.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kltyton.eden_realm.common.block.plant.PlantBehaviorCheck'
}

tasks.register('verifyMossStoneColossus', JavaExec) {
    group = 'verification'
    description = 'Checks independent colossus attributes, model-scale dimensions, and vanilla step-sound resources.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kltyton.eden_realm.common.entity.boss.MossStoneColossusCheck'
}

tasks.register('verifyLeafParticles', JavaExec) {
    group = 'verification'
    description = 'Checks per-species falling leaf particle registration, descriptions, and 184 source-matched textures.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kltyton.eden_realm.client.particle.LeafParticleAssetsCheck'
}

// Opt-in server-side crop regressions; test classes never enter the distributable jar.
if (providers.gradleProperty('harvestTests').isPresent()) {
    neoForge.mods.named(mod_id) {
        sourceSet(sourceSets.test)
    }
    neoForge.runs.named('gameTestServer') {
        gameDirectory = file('build/harvest-gametest-run')
        systemProperty 'edenrealm.testStructures', file('src/test/structures').absolutePath
        programArguments.addAll '--universe', file('build/harvest-gametest-world').absolutePath,
                '--tests', 'eden_realm:harvest_*', '--report', file('build/harvest-gametest-results.xml').absolutePath
    }
    tasks.named('runGameTestServer') {
        dependsOn testClasses
    }
}
// Opt-in OBB integration checks run with real server collision and Mixin application.
if (providers.gradleProperty('obbTests').isPresent()) {
    neoForge.mods.named(mod_id) {
        sourceSet(sourceSets.test)
    }
    neoForge.runs.named('gameTestServer') {
        gameDirectory = file('build/obb-gametest-run')
        systemProperty 'edenrealm.obbTests', 'true'
        systemProperty 'edenrealm.testStructures', file('src/test/structures').absolutePath
        programArguments.addAll '--universe', file('build/obb-gametest-world').absolutePath,
                '--tests', 'eden_realm:obb_*', '--report', file('build/obb-gametest-results.xml').absolutePath
    }
    tasks.named('runGameTestServer') {
        dependsOn testClasses
    }
}
tasks.register('verifyOreModels', JavaExec) {
    group = 'verification'
    description = 'Checks authored ore glow layers with the native model parser.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kltyton.eden_realm.data.model.block.OreModelCheck'
}

if (providers.gradleProperty('villagerTests').isPresent()) {
    neoForge.mods.named(mod_id) { sourceSet(sourceSets.test) }
    neoForge.runs.named('gameTestServer') {
        gameDirectory = file('build/villager-gametest-run')
        systemProperty 'edenrealm.villagerTests', 'true'
        systemProperty 'edenrealm.testStructures', file('src/test/structures').absolutePath
        programArguments.addAll '--universe', file('build/villager-gametest-world').absolutePath,
                '--tests', 'eden_realm:villager_*', '--report', file('build/villager-gametest-results.xml').absolutePath
    }
    tasks.named('runGameTestServer') { dependsOn testClasses }
}

tasks.named('check') {
    dependsOn tasks.named('verifyOreModels')
    dependsOn tasks.named('verifyAutomaticBlockShapes')
    dependsOn tasks.named('verifyPlantBehavior')
    dependsOn tasks.named('verifyMossStoneColossus')
    dependsOn tasks.named('verifyLeafParticles')
}

tasks.named('test', Test) {
    failOnNoDiscoveredTests = false
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             particle_storm_version : particle_storm_version,
                             geckolib_version       : geckolib_version,
                             bonehitboxlib_version   : bonehitboxlib_version,
                             kltytonui_version      : kltytonui_version,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
